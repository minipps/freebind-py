name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: CPython ${{ matrix.python-version }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        dependencies: [minimum, newest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimum allowed clients
        if: matrix.dependencies == 'minimum'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --editable . \
            "requests==2.34.2" "urllib3==2.7" "aiohttp==3.13.5" \
            "httpx==0.28.1" "httpcore==1.0.9" "anyio==4.10"
      - name: Install newest allowed clients
        if: matrix.dependencies == 'newest'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --editable ".[all]"
      - name: Run unit suite
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Check runnable examples
        run: |
          for example in examples/requests_client.py examples/aiohttp_client.py examples/httpx_client.py examples/patch.py; do
            .venv/bin/python "$example" --help >/dev/null
          done

  namespace:
    name: Namespace parity / ${{ matrix.dependencies }} clients
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dependencies: [minimum, newest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install namespace tools and system Python venv
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 util-linux python3.12-venv
          /usr/bin/python3.12 -m venv .venv
      - name: Install minimum allowed clients
        if: matrix.dependencies == 'minimum'
        run: |
          .venv/bin/python -m pip install --editable . \
            "requests==2.34.2" "urllib3==2.7" "aiohttp==3.13.5" \
            "httpx==0.28.1" "httpcore==1.0.9" "anyio==4.10"
      - name: Install newest allowed clients
        if: matrix.dependencies == 'newest'
        run: |
          .venv/bin/python -m pip install --editable ".[all]"
      - name: Run real namespace parity suite with capabilities dropped for clients
        run: |
          python_path="$GITHUB_WORKSPACE/.venv/bin/python"
          sudo "$python_path" tests/network_harness.py -- \
            "$python_path" -m unittest discover -s tests -p test_network.py -v

  arm64:
    name: ARM64 Linux smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install newest allowed clients
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --editable ".[all]"
      - name: Run unit suite
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Check runnable examples
        run: |
          for example in examples/requests_client.py examples/aiohttp_client.py examples/httpx_client.py examples/patch.py; do
            .venv/bin/python "$example" --help >/dev/null
          done
